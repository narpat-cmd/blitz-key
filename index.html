
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLITZ FREE KEY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080b14;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
}

.container {
    text-align: center;
    background: #111827;
    padding: 40px 25px;
    border: 1px solid #00eaff;
    border-radius: 18px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 0 25px #00eaff44;
}

h1 {
    color: #00eaff;
    font-size: 30px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px #00eaff;
}

/* BUTTONS */
button {
    width: 100%;
    padding: 17px 10px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.unlock {
    background: #00eaff;
    border: 1px solid #00eaff;
    color: #080b14;
}

.unlock:hover {
    box-shadow: 0 0 20px #00eaff;
}

.key {
    background: #080b14;
    border: 1px solid #00eaff;
    color: white;
}

.key:hover {
    background: #00eaff;
    color: #080b14;
    box-shadow: 0 0 20px #00eaff;
}

button:active {
    transform: scale(0.97);
}

#timer {
    margin-top: 20px;
    color: #00eaff;
    font-size: 17px;
    min-height: 20px;
}

#keySection {
    display: none;
    margin-top: 15px;
}

.device-info {
    margin-top: 12px;
    color: #00eaff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
}

#message {
    margin-top: 20px;
    color: #00ff99;
    font-size: 14px;
    min-height: 18px;
}

.footer {
    margin-top: 30px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>BLITZ FREE KEY</h1>

    <button class="unlock" id="unlockBtn" onclick="startUnlock()">
        🔓 UNLOCK
    </button>

    <p id="timer"></p>

    <div id="keySection">

        <button class="key" onclick="copyKey()">
            BLZ-LX5KUR-59RZ8L
        </button>

        <p class="device-info">1 Device • 1 Day</p>

    </div>

    <p id="message">CLICK UNLOCK TO GET YOUR KEY</p>

    <div class="footer">
        BLITZ FREE KEY SYSTEM
    </div>

</div>

<script>

const key = "BLZ-LX5KUR-59RZ8L";

function startUnlock() {

    const button = document.getElementById("unlockBtn");
    const timer = document.getElementById("timer");
    const keySection = document.getElementById("keySection");
    const message = document.getElementById("message");

    let seconds = 5;

    button.disabled = true;
    button.style.opacity = "0.6";
    button.innerText = "PLEASE WAIT...";

    message.innerText = "";

    timer.innerText = "UNLOCKING IN " + seconds + " SECONDS";

    const countdown = setInterval(() => {

        seconds--;

        if (seconds > 0) {
            timer.innerText = "UNLOCKING IN " + seconds + " SECONDS";
        } else {

            clearInterval(countdown);

            timer.innerText = "✓ UNLOCK SUCCESSFUL!";

            button.style.display = "none";
            keySection.style.display = "block";

            message.innerText = "YOUR FREE KEY IS READY!";
        }

    }, 1000);
}

async function copyKey() {

    const message = document.getElementById("message");

    try {

        await navigator.clipboard.writeText(key);
        message.innerText = "✓ KEY COPIED SUCCESSFULLY!";

    } catch (error) {

        const input = document.createElement("textarea");

        input.value = key;
        input.style.position = "fixed";
        input.style.opacity = "0";

        document.body.appendChild(input);
        input.select();

        if (document.execCommand("copy")) {
            message.innerText = "✓ KEY COPIED SUCCESSFULLY!";
        } else {
            message.innerText = "COPY FAILED - TRY AGAIN";
        }

        input.remove();
    }
}

</script>

</body>
</html>
